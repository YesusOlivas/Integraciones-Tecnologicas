<div [class]="'login-body flex min-h-screen  '+(layoutService.config().colorScheme === 'light' ? 'layout-light':'layout-dark')">
    <div class="login-image w-6 h-screen hidden md:block" style="max-width: 490px;">
        <img [src]="'assets/images/image_login.jpg'"alt="atlantis" class=" h-screen w-full" >
    </div>
    <div class="w-full" style="background:var(--surface-ground)">
        <div class="p-fluid min-h-screen bg-auto md:bg-contain bg-no-repeat text-center w-full flex align-items-center md:align-items-start justify-content-center flex-column bg-auto md:bg-contain bg-no-repeat"
            style=" padding: 20% 10% 20% 10%;background:var(--exception-pages-image)">
            <div class="flex flex-column">
                <div class="flex align-items-center mb-6 logo-container">
                    <img [src]="'assets/layout/images/logo-'+ (layoutService.config().colorScheme === 'light' ? 'dark' : 'light') + '.png'"
                         class="login-logo" style=" width: 45px;"/>
                    <h4 class="ml-4 mb-4">Inicio de Sesión</h4>
                </div>
                <div class="form-container text-left" style="max-width: 320px; min-width: 270px;">
                    <span class="block text-600 font-medium mb-4">Completa los campos.</span>
                    <span class="p-input-icon-left">
                        <i class="pi pi-user"></i>
                        <input type="text" autocomplete="off" pInputText placeholder="Usuario" class="block mb-3" style="   max-width: 320px;
                        min-width: 270px;">
                    </span>
                    <span class="p-input-icon-left">
                        <i class="pi pi-key"></i>
                        <input type="password" autocomplete="off" pInputText placeholder="Contraseña" class="block mb-3" style="   max-width: 320px;
                        min-width: 270px;">
                    </span>
                </div>
                <div class="button-container mt-4 text-left" style="max-width: 320px;min-width: 270px;">
                    <div class="buttons flex align-items-center gap-3">
                        <button type="button" pButton label="Inciar Sesión" class="block" style="max-width: 320px;
                        margin-bottom: 32px;"></button>
                    </div>
                </div>
            </div>
    
            <div class="login-footer flex align-items-center absolute" style="bottom: 75px;">
                <div class="flex align-items-center login-footer-logo-container pr-4 mr-4 border-right-1 surface-border">
                    <img src="assets/images/integraciones_tecnologicas.png" class="login-footer-appname ml-2" style="  width: 145px;"/>
                </div>
                <span class="text-color-secondary mr-3">Prueba Técnica</span>
            </div>
        </div>
    </div>
</div>
